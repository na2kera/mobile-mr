<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>01. Stereo Box — Mobile MR</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        /* iOS Safari は requestFullscreen 非対応のため 100dvh で全画面風にする */
        height: 100dvh;
        background: #000;
        color: #e8eaed;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app,
      #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* 開始オーバーレイ（センサー許可はユーザージェスチャー起点が必須） */
      #start-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #14161a;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        z-index: 10;
      }
      #start-overlay h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      #start-overlay p {
        margin: 0;
        color: #9aa0a6;
        font-size: 0.85rem;
        max-width: 32em;
      }
      #start-button {
        font-size: 1.1rem;
        font-weight: 600;
        padding: 14px 48px;
        border-radius: 999px;
        border: none;
        background: #8ab4f8;
        color: #14161a;
      }
      #start-overlay a {
        color: #9aa0a6;
        font-size: 0.8rem;
      }
      /* 開始後、縦向きのときだけ表示する案内 */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        background: rgba(0, 0, 0, 0.85);
        color: #e8eaed;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        text-align: center;
        padding: 24px;
      }
      body.started #start-overlay {
        display: none;
      }
      @media (orientation: portrait) {
        body.started #rotate-hint {
          display: flex;
        }
      }
      /* デバッグ用 HUD（現在のパラメータ表示） */
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 4;
        font-size: 10px;
        color: rgba(232, 234, 237, 0.5);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="start-overlay">
      <h1>01. Stereo Box</h1>
      <p>
        開始するとセンサーの許可を求めます。許可後、スマホを横向きにして
        VR ゴーグルにセットしてください。
      </p>
      <button id="start-button" type="button">開始</button>
      <p>調整: URL に ?fov=70&amp;eyeSep=0.064 を付けると変更できます</p>
      <a href="/">← デモ一覧へ戻る</a>
    </div>
    <div id="rotate-hint">スマホを横向きにしてください</div>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
