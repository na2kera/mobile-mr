<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex9-1. 化身 俯瞰画面 — Mobile MR</title>
    <style>
      /* 見た目は 08 の俯瞰画面と同じ（最小限の操作パネル + 3D ビュー） */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #000;
        color: #e8eaed;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #app,
      #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* 左上のパネル（カメラもゴーグルも要らない） */
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        width: 300px;
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(20, 22, 26, 0.88);
        border: 1px solid #3c4043;
        font-size: 0.85rem;
      }
      #panel h1 {
        font-size: 1rem;
        margin: 0 0 6px;
      }
      #panel .sub {
        color: #9aa0a6;
        font-size: 0.75rem;
        margin: 0 0 10px;
      }
      #players {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      #players li {
        padding: 6px 8px;
        border-radius: 8px;
        background: #1d2024;
        border-left: 4px solid #5f6368;
      }
      #players .track {
        font-size: 0.75rem;
        color: #9aa0a6;
      }
      #players .track.marker {
        color: #81c995;
      }
      #players .track.gyro {
        color: #fdd663;
      }
      #players .track.none {
        color: #f28b82;
      }
      #status {
        color: #9aa0a6;
        font-size: 0.75rem;
        white-space: pre-wrap;
      }
      #panel a {
        color: #9aa0a6;
        font-size: 0.75rem;
      }
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 6;
        font-size: 10px;
        color: rgba(232, 234, 237, 0.55);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>ex9-1. 化身 俯瞰画面</h1>
      <p class="sub">
        同じ room のスマホの頭（視線の線・名前・位置の信用度）と、その背後の化身を表示します。
        床の目安は各プレイヤーの頭 − eyeH。ドラッグで回転、ホイールで拡大。
      </p>
      <ul id="players"></ul>
      <p id="status">接続中…</p>
      <a href="/">← デモ一覧へ戻る</a>
    </div>
    <div id="hud"></div>
    <script type="module" src="./overview.ts"></script>
  </body>
</html>
