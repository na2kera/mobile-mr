<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08-6. 画面マーカー（モニタ / プロジェクタに表示） — Mobile MR</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #000;
        color: #e8eaed;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      /* マーカー板。全画面ではウィンドウ = 画面なので、ここでの px 差がそのまま実寸差になる */
      #board {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
      }
      #board.bg-white {
        background: #fff;
      }
      /* 白黒の反転（プロジェクタ実験用。黒枠が白になるので今の検出器では検出されない。README 参照） */
      #board.invert {
        filter: invert(1);
      }
      #board .tile {
        position: absolute;
        /* 余白込みの SVG（10 セル）。width / height は markers-screen.ts が px で入れる */
        background: #fff;
        transform: translate(-50%, -50%);
      }
      #board .tile svg {
        width: 100%;
        height: 100%;
        display: block;
        /* 拡大時にセルの境界をぼかさない */
        shape-rendering: crispEdges;
      }
      #board .tile .cap {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 2px;
        text-align: center;
        font-size: 11px;
        color: #5f6368;
        white-space: nowrap;
      }
      #board.bg-white .tile .cap {
        color: #9aa0a6;
      }
      /* 左上の操作パネル（俯瞰画面と同じ見た目。「隠す」で小さなボタンだけ残す） */
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        width: 320px;
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(20, 22, 26, 0.92);
        border: 1px solid #3c4043;
        font-size: 0.85rem;
      }
      #panel h1 {
        font-size: 1rem;
        margin: 0 0 6px;
      }
      #panel .sub {
        color: #9aa0a6;
        font-size: 0.75rem;
        margin: 0 0 10px;
      }
      #panel fieldset {
        border: 1px solid #3c4043;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 0 0 8px;
      }
      #panel legend {
        color: #9aa0a6;
        font-size: 0.75rem;
        padding: 0 4px;
      }
      #panel .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        align-items: end;
        margin-bottom: 6px;
      }
      #panel label {
        display: grid;
        gap: 2px;
        font-size: 0.7rem;
        color: #9aa0a6;
      }
      #panel label.check {
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 6px;
      }
      #panel input[type="number"],
      #panel select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #5f6368;
        background: #14161a;
        color: #e8eaed;
        font-size: 0.9rem;
      }
      #panel .hint {
        margin-top: 4px;
        color: #9aa0a6;
        font-size: 0.7rem;
        min-height: 1em;
        white-space: pre-wrap;
      }
      #panel .hint.warn {
        color: #f28b82;
      }
      #panel button {
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        background: #8ab4f8;
        color: #14161a;
        font-weight: 700;
        cursor: pointer;
      }
      #panel button:disabled {
        background: #3c4043;
        color: #9aa0a6;
        cursor: default;
      }
      #panel button.ghost {
        background: transparent;
        border: 1px solid #5f6368;
        color: #e8eaed;
      }
      #panel .buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      #panel a {
        color: #9aa0a6;
        font-size: 0.75rem;
      }
      #phase {
        font-size: 1rem;
        font-weight: 700;
        margin: 6px 0;
      }
      /* パネルを隠したときに残す小さなボタン（マーカーの邪魔にならない角） */
      #show-panel {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 6;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid #3c4043;
        background: rgba(20, 22, 26, 0.6);
        color: #9aa0a6;
        font-size: 0.7rem;
        cursor: pointer;
      }
      /* 機械可読の 1 行（ヘッドレス確認用） */
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 6;
        font-size: 10px;
        color: rgba(232, 234, 237, 0.35);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <button id="show-panel" type="button" hidden>パネルを表示</button>
    <div id="panel">
      <h1>08-6. 画面マーカー</h1>
      <p class="sub">
        このウィンドウをモニタかプロジェクタに全画面で出し、スマホのカメラに見せます（画面 = 正面の壁）。
        画面の実寸はブラウザから取れないので対角の実寸を入れてください（この PC に保存します）。
        原点（ID 0）は画面の中央。追加マーカーの位置は画面上の距離から自動で決まるので、「room に反映」を押すだけで巻き尺は要りません。
        マーカーの一辺（mm）は room の設定なので、変えたら全員のデモ URL と俯瞰画面に ?markerMm= を付けて入り直します。
      </p>
      <div id="phase">接続中…</div>
      <fieldset>
        <legend>画面の実寸</legend>
        <div class="row">
          <label>対角 [インチ]<input id="screen-in" type="number" step="0.1" min="3" max="400" inputmode="decimal" /></label>
          <label>1mm あたり px（直接指定）<input id="px-per-mm" type="number" step="0.01" min="0.1" max="100" inputmode="decimal" /></label>
        </div>
        <div class="hint" id="screen-hint"></div>
      </fieldset>
      <fieldset>
        <legend>マーカー</legend>
        <div class="row">
          <label>一辺 [mm]（room の ?markerMm=）<input id="marker-mm" type="number" step="5" min="20" max="5000" inputmode="numeric" /></label>
          <label>モード<select id="mode"><option value="single">遠い: 1 枚を大きく</option><option value="multi">近い: 複数枚を小さく</option></select></label>
        </div>
        <div class="row">
          <label>追加マーカーの枚数（近いモード）<input id="count" type="number" step="1" min="0" max="8" inputmode="numeric" /></label>
          <label>間隔（一辺に対する比）<input id="gap" type="number" step="0.05" min="0" max="2" inputmode="decimal" /></label>
        </div>
        <div class="row">
          <label class="check"><input id="invert" type="checkbox" />白黒を反転（プロジェクタ実験用）</label>
          <label class="check"><input id="bg-white" type="checkbox" />背景を白に</label>
        </div>
        <div class="hint" id="marker-hint"></div>
      </fieldset>
      <div class="buttons">
        <button id="fullscreen" type="button" class="ghost">全画面</button>
        <button id="hide-panel" type="button" class="ghost">パネルを隠す</button>
        <button id="apply" type="button" disabled>room に反映</button>
      </div>
      <div class="hint" id="apply-hint"></div>
      <p><a href="./overview.html">← 俯瞰画面へ</a>　<a href="./">プレイヤー画面へ</a>　<a href="/">デモ一覧へ</a></p>
    </div>
    <div id="hud"></div>
    <script type="module" src="./markers-screen.ts"></script>
  </body>
</html>
