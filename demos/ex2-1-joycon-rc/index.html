<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ex2-1. Joy-Con RC — Mobile MR</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100dvh;
        background: #000;
        color: #e8eaed;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app,
      #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* 接続状態・操作説明のパネル。Joy-Con はボタンを押すまで Gamepad API に
         現れないため、「押してください」の案内を常時出しておく必要がある */
      #panel {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        z-index: 5;
        max-width: min(70vw, 30em);
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(20, 22, 26, 0.75);
        backdrop-filter: blur(4px);
        pointer-events: none;
        font-size: 12px;
        line-height: 1.5;
      }
      #panel h1 {
        font-size: 13px;
        margin: 0 0 2px;
      }
      #status {
        color: #fdd663;
        white-space: pre-wrap;
      }
      #status.connected {
        color: #81c995;
      }
      #help {
        color: #9aa0a6;
        margin: 4px 0 0;
      }
      #panel a {
        color: #9aa0a6;
        pointer-events: auto;
      }
      /* 生の軸・ボタン値の HUD（実機では console が見えないため、Joy-Con の
         マッピング差をここで確認して URL パラメータで合わせ込む） */
      #hud {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 5;
        font-size: 10px;
        color: rgba(232, 234, 237, 0.5);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>ex2-1. Joy-Con RC</h1>
      <div id="status">
        Joy-Con をスマホに Bluetooth ペアリングして、どれかボタンを押してください
      </div>
      <p id="help">
        スティックで操作: 縦 = 前進/後退、横 = ハンドル。効かないときは十字ボタン。
        PC はカーソルキー / WASD。R キー or スティック押し込みで位置リセット
      </p>
      <a href="/">← デモ一覧へ戻る</a>
    </div>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
